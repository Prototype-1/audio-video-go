<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Video Player</title>
    <link rel="stylesheet" href="/templates/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <h2>Upload Video/Audio</h2>
    <form action="http://localhost:8000/upload" method="post" enctype="multipart/form-data">
        <label for="media-upload">Choose a file to upload</label>
        <input type="file" id="media-upload" name="media" required>
        <button type="submit">Upload & Convert</button>
    </form>

    <h2>Playback</h2>
    <video id="videoPlayer" controls width="600"></video>

    <script>
        async function loadLatestVideo() {
            try {
                let response = await fetch('http://localhost:8000/latest-video');
                if (!response.ok) {
                    console.log("No processed video found.");
                    return;
                }
    
                let filename = await response.text();
                let videoSrc = `/hls/${filename}/index.m3u8`;
    
                if (Hls.isSupported()) {
                    let video = document.getElementById("videoPlayer");
                    let hls = new Hls();
                    hls.loadSource(videoSrc);
                    hls.attachMedia(video);
                } else {
                    document.getElementById("videoPlayer").src = videoSrc;
                }
            } catch (error) {
                console.log("Error fetching latest video:", error);
            }
        }
        loadLatestVideo();
    </script>
</body>
</html>
